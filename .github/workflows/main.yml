name: Windows Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (MSI + NSIS)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check & run unit tests
        run: |
          npm run typecheck
          npm test

      - name: Generate Vesper icon set
        run: npm run icon

      - name: Run Rust backend unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Read app version
        id: appver
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "Vesper version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows Tauri application (MSI + NSIS + EXE)
        run: npx tauri build

      - name: Verify installer outputs exist
        shell: pwsh
        run: |
          $exe = Get-Item "src-tauri/target/release/vesper.exe" -ErrorAction Stop
          $msi = Get-Item "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction Stop
          $nsis = Get-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction Stop
          Write-Host "Built EXE: $($exe.FullName)"
          Write-Host "Built MSI: $($msi.FullName)"
          Write-Host "Built NSIS: $($nsis.FullName)"

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vesper-windows-installer
          retention-days: 30
          path: |
            src-tauri/target/release/vesper.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.appver.outputs.version) }}
          name: Vesper ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.appver.outputs.version) }} (Windows 64-bit)
          make_latest: true
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/vesper.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
