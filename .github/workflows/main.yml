name: Windows Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

# Rapid consecutive pushes were queuing parallel Windows builds that all published
# to the SAME release tag. Whichever finished last won, so an older run could
# re-upload assets a newer run had just removed. One build at a time per branch.
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows Installer (MSI + NSIS)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check & run unit tests
        run: |
          npm run typecheck
          npm test

      - name: Generate Vesper icon set
        run: npm run icon

      - name: Run Rust backend unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Read app version
        id: appver
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "Vesper version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Offline guarantee check
        shell: pwsh
        run: |
          # Vesper must work with no internet. Fail the build if the frontend ever
          # regains a remote dependency (webfont CDN, remote script/style, fetch...).
          npm run build | Out-Null
          $problems = @()

          if (Select-String -Path "dist/index.html" -Pattern 'https?://' -AllMatches) {
            $problems += "dist/index.html references a remote URL"
          }
          if (Select-String -Path "dist/assets/*.css" -Pattern 'url\(\s*.?https?://' -AllMatches) {
            $problems += "bundled CSS loads a remote file (webfont/CDN?)"
          }
          if (Select-String -Path "src/**/*.ts","src/**/*.tsx" -Pattern 'fetch\(|XMLHttpRequest|new WebSocket|sendBeacon' -AllMatches) {
            $problems += "frontend contains a network call"
          }

          # The webfonts are meant to ship inside the app. If they are referenced but
          # absent, the UI silently falls back to system fonts - fail loudly instead.
          # Webfonts must actually reach the build: every /fonts/... URL in the bundled
          # CSS has to resolve to a real file (or be inlined as a data: URI).
          $cssText = (Get-Content "dist/assets/*.css" -Raw) -join "`n"
          if (([regex]::Matches($cssText, '@font-face')).Count -lt 1) {
            $problems += "no @font-face rules reached the built CSS - webfonts are gone"
          }
          $refs = [regex]::Matches($cssText, 'url\(["'']?/fonts/([^")]+)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          foreach ($r in $refs) {
            if (-not (Test-Path "dist/fonts/$r")) { $problems += "bundled CSS needs dist/fonts/$r but it is missing" }
          }
          Write-Host "webfont check: $(@($refs).Count) file reference(s), $(([regex]::Matches($cssText,'data:font/woff2;base64')).Count) inlined"

          if ($problems.Count -gt 0) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "Offline check passed: no remote URLs, no network calls in the frontend."

      - name: Build Windows Tauri application (MSI + NSIS + EXE)
        run: npx tauri build

      - name: Verify installer outputs exist
        shell: pwsh
        run: |
          $exe = Get-Item "src-tauri/target/release/vesper.exe" -ErrorAction Stop
          $msi = Get-Item "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction Stop
          $nsis = Get-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction Stop
          Write-Host "Built EXE: $($exe.FullName)"
          Write-Host "Built MSI: $($msi.FullName)"
          Write-Host "Built NSIS: $($nsis.FullName)"

          # The installer must stay small on purpose: it downloads the WebView2 runtime
          # during install instead of embedding it (+127 MB). Guard that decision.
          $limitMB = 40
          foreach ($f in @($msi, $nsis)) {
            $mb = [math]::Round($f.Length / 1MB, 2)
            Write-Host "$($f.Name): $mb MB"
            if ($mb -gt $limitMB) {
              Write-Host "::error::$($f.Name) is $mb MB - installer must stay under $limitMB MB (webviewInstallMode likely set to offlineInstaller)"
              exit 1
            }
          }

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vesper-windows-installer
          retention-days: 30
          path: |
            src-tauri/target/release/vesper.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Remove obsolete release assets
        # Cleanup must NEVER be able to block a release: it runs before publishing,
        # so an API hiccup here previously skipped the publish step entirely (run #78).
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.appver.outputs.version) }}"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github+json"
            "User-Agent"  = "vesper-release-cleanup"
          }
          # softprops/action-gh-release only ADDS assets; it never deletes stale ones.
          # Without this, an old portable `vesper.exe` sticks around forever and people
          # keep downloading it instead of the installer.
          try {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers -ErrorAction Stop
          } catch {
            Write-Host "No release $tag yet - nothing to clean."
            exit 0
          }
          $deleted = 0
          foreach ($asset in @($rel.assets)) {
            if ($asset.name -in @('vesper.exe', 'Vesper.exe')) {
              try {
                Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$repo/releases/assets/$($asset.id)" -Headers $headers -ErrorAction Stop
                Write-Host "Removed stale asset $($asset.name) ($([math]::Round($asset.size/1MB,2)) MB) from $tag"
                $deleted++
              } catch {
                Write-Host "::warning::Could not delete $($asset.name): $($_.Exception.Message)"
                Write-Host "::warning::Delete it by hand: gh release delete-asset $tag $($asset.name) -y"
              }
            }
          }
          Write-Host "Cleanup done - $deleted stale asset(s) removed."
          exit 0

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.appver.outputs.version) }}
          name: Vesper ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.appver.outputs.version) }} (Windows 64-bit)
          make_latest: true
          draft: false
          prerelease: false
          generate_release_notes: true
          # Deliberately NOT publishing the bare `vesper.exe`: people downloaded it,
          # double-clicked it and got a portable app with no entry in Apps & Features,
          # no Start Menu shortcut and no uninstaller. Only real installers ship.
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
