[package]
name = "vesper"
version = "0.4.0"
description = "Minimalist local music player for Windows with custom covers, native EQ, synced lyrics, and round desktop widget."
authors = ["Shohail Mahmud"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "vesper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rodio = { version = "0.20", default-features = true, features = ["symphonia-all"] }
lofty = "0.21"
walkdir = "2"
dirs = "5"
parking_lot = "0.12"
anyhow = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
souvlaki = "0.7"
